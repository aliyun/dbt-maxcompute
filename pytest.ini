[pytest]
markers =
    core_test: Core test suite for release validation
    integration_smoke: Minimal real-SQL regression set; needs a MaxCompute project
filterwarnings =
    ignore:.*'soft_unicode' has been renamed to 'soft_str'*:DeprecationWarning
    ignore:unclosed file .*:ResourceWarning
env_files =
    test.env
testpaths =
    tests/unit
    tests/unit_test
    tests/functional
