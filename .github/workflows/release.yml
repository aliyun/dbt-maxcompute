# **what?**
# Runs the release checks for a pushed tag: unit tests, the Core / Python-model /
# UDF functional set when MaxCompute credentials are configured, and a package
# build with `twine`-style metadata checks.
#
# Publishing to PyPI and creating the GitHub Release live in
# `.github/workflows/publish.yml`, which is run by hand on purpose.
#
# **why?**
# Two public facts about the previous version of this file:
#
# * It was named `Publish to PyPI`, and its `publish-pypi` job declared
#   `environment: pypi` with trusted publishing (`id-token: write`).
# * Every recorded run of it - 11 in total, 2026-03-03 through 2026-10-22, one per
#   pushed tag - ended `completed/failure` at the step
#   `Prepare MaxCompute test profile`, because the first command there is
#   `test -n "$DBT_PROFILE_YAML"` and the repository secret is not configured.
#   `Build distribution`, `Publish to PyPI` and `Create GitHub Release` were
#   `skipped` in all of them.
#
# So the tag path never published anything, and a red run there said nothing about
# the code being tagged - while releases kept appearing on PyPI and as GitHub
# Releases, uploaded from outside this workflow. The name promised automation that
# did not exist, and the gate blocked nothing.
#
# This file now reports what it can actually prove and marks the rest as NOT RUN,
# in the same shape as the existing `gate` job in `.github/workflows/integration.yml`.
# The publish path moved to a deliberate, human-triggered run where the functional
# gate is *required*: publishing without live MaxCompute evidence stays impossible,
# and a tag push without the secret is no longer reported as a failed release.
#
# If the project later decides that a tag push should publish automatically, that is
# one trigger line plus configuring the secret and the `pypi` environment - the
# capability is kept intact in `publish.yml`, not deleted here.
#
# **when?**
# This will run when a tag matching 'v*' is pushed (e.g., v1.0.0, v1.0.0a1).

name: Release checks on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-tests:
    name: Core, MaxFrame, and UDF Tests

    runs-on: ubuntu-latest

    outputs:
      functional_ran: ${{ steps.profile.outputs.can_run }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e ".[maxframe,semantic]"
          python -m pip --version
          dbt --version

      - name: Prepare MaxCompute test profile
        id: profile
        env:
          DBT_PROFILE_YAML: ${{ secrets.DBT_PROFILE_YAML }}
        run: |
          set -uo pipefail
          if [ -z "$DBT_PROFILE_YAML" ]; then
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "## release functional tests: NOT RUN"
              echo ""
              echo "- The repository secret \`DBT_PROFILE_YAML\` is not configured, so no SQL will run."
              echo "- **This is not a live MaxCompute pass.** The unit suite below still runs."
              echo "- See docs/integration-tests.md for what the release functional set covers,"
              echo "  and docs/releasing.md for how to publish once it can run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DBT_PROFILE_YAML is not configured: functional steps will be skipped"
            exit 0
          fi
          profile_path="$RUNNER_TEMP/dbt_profile.yml"
          printf '%s\n' "$DBT_PROFILE_YAML" > "$profile_path"
          chmod 600 "$profile_path"
          echo "DBT_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: pytest tests/unit tests/unit_test -q

      - name: Run release functional tests
        if: steps.profile.outputs.can_run == 'true'
        run: >-
          pytest
          tests/functional/test_core.py
          tests/functional/adapter/test_python_model.py
          tests/functional/adapter/test_udf.py
          -v --tb=short
        env:
          DBT_TEST_USER_1: RAM$mc_schema@test.aliyunid.com:test_user_2507
          DBT_TEST_USER_2: RAM$mc_schema@test.aliyunid.com:test_user_2507
          DBT_TEST_USER_3: RAM$mc_schema@test.aliyunid.com:test_user_2507

  build:
    name: Build distribution

    needs: release-tests

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --upgrade setuptools wheel build
          python -m pip --version

      - name: Build distributions
        run: python -m build

      - name: Show distributions
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          overwrite: true
